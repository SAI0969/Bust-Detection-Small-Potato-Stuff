services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend (Operational AI / Models)
  # ----------------------------------------------------
  - type: web
    name: nwp-forecast-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # ----------------------------------------------------
  # 2. Vite React Frontend (Doppler Radar & Dashboard)
  # ----------------------------------------------------
  - type: web
    name: nwp-forecast-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://nwp-forecast-backend-x7mn.onrender.com/api/v1
